# 최초 인증서 발급 전용 부트스트랩 설정 (HTTP 전용)
#
# 정식 설정(api.paperpilot.cloud.conf)은 ssl_certificate 경로를 참조하므로
# 인증서가 없는 상태에서는 nginx -t 가 실패한다.
# 그래서 최초 1회는 이 파일로 nginx를 띄워 ACME 챌린지만 응답하게 한 뒤,
# certbot --webroot 로 인증서를 발급받고 정식 설정으로 교체한다.
#
# 인증서 발급이 끝나면 이 파일은 sites-enabled에서 제거한다.

server {
    listen 80;
    server_name api.paperpilot.cloud;

    # certbot --webroot 가 챌린지 파일을 놓는 경로
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 404;
    }
}
