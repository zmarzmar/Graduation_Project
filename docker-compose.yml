services:
  postgres:
    image: postgres:16-alpine
    container_name: ai_research_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ai_research}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  chromadb:
    # BE의 chromadb-client와 같은 버전으로 고정한다 (호환 테스트를 통과한 조합). 올릴 때는 둘을 함께 올린다.
    image: chromadb/chroma:1.5.5
    container_name: ai_research_chroma
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      # 이 이미지는 /data에 저장한다 (이전의 /chroma/chroma에는 아무것도 쓰이지 않아 색인이 보존되지 않았다)
      - chroma_data:/data

volumes:
  postgres_data:
  chroma_data:
